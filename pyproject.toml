[project]
name = "kengine"
version = "0.1.0"
description = "KV-cache-centric LLM inference engine on top of PyTorch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6",
    "safetensors>=0.4",
    "tokenizers>=0.20",
    "huggingface_hub>=0.25",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "transformers>=4.45",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kengine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
